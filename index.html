    <!-- ElevenLabs Conversational AI voice widget — warm boutique theme -->
    <style>
      elevenlabs-convai {
        --el-accent: #ee975a;          /* site accent (hsl 25 80% 62%) */
        --el-accent-hover: #e88440;
        --el-bg: #fbf6ef;              /* soft cream */
        --el-surface: #ffffff;
        --el-text: #2b2620;
        --el-muted: #7a6f63;
        --el-border: rgba(217, 122, 60, 0.18);
        --el-radius: 22px;
        --el-shadow: 0 18px 48px -12px rgba(120, 70, 30, 0.28);
        --el-font: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      }
    </style>

    <elevenlabs-convai
      agent-id="agent_6701kn61qbj6fbja0ebv3znm2rge"
      placement="bottom-right"
      variant="full"
      avatar-orb-color-1="#ee975a"
      avatar-orb-color-2="#f4b487"
      language="en"
      text-contents='{"main_label":"Questions? Chat with our AI assistant","start_call":"Start AI voice chat","end_call":"End AI voice chat"}'
    ></elevenlabs-convai>

    <script>
      // Lazy-load the ElevenLabs widget to keep it off the critical main-thread path.
      (function () {
        var loaded = false;
        function loadWidget() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.src = 'https://unpkg.com/@elevenlabs/convai-widget-embed';
          s.async = true;
          document.body.appendChild(s);
        }
        var trigger = function () { loadWidget(); };
        ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) {
          window.addEventListener(e, trigger, { once: true, passive: true });
        });
        // Fallback: load when the browser is idle, or after a short delay.
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadWidget, { timeout: 5000 });
        } else {
          setTimeout(loadWidget, 4000);
        }
      })();
    </script>
